{% if banner %}
<div class="card flex items-start gap-2.5 px-3.5 py-2.5">
  <span class="mt-px font-mono text-[11px] {{ 'text-red-400/80' if ok is defined and not ok else 'text-emerald-400/80' }}">$</span>
  <p class="min-w-0 font-mono text-[10px] leading-relaxed {{ 'text-red-400/80' if ok is defined and not ok else 'text-zinc-400' }}">{{ banner }}</p>
</div>
{% endif %}
{% for job in jobs %}{% include "_row.html" %}{% else %}
<div class="card flex flex-col items-center gap-2 px-4 py-14 text-center">
  <span class="grid h-8 w-8 place-items-center rounded-md border border-zinc-800 text-zinc-700">
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
  </span>
  <p class="font-mono text-[11px] text-zinc-500">no rows here · scraper idle</p>
  <p class="font-mono text-[10px] text-zinc-700">run $scrape-jobs to fill the queue · switch tabs to widen the filter</p>
</div>
{% endfor %}
